name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish a validated main image (runs the complete suite)
        type: boolean
        default: false

# One PR run per revision; feature pushes no longer duplicate the PR run.
# Never interrupt a running main release/image publication with a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ci-only-synthetic-test-key-for-isolated-github-actions-56d2f84a7e31b902
  DJANGO_DEBUG: "True"
  DATABASE_URL: postgresql://jsk_ci:jsk_ci@127.0.0.1:5432/jsk_ci
  PAYMENT_GATEWAY: mock
  METAL_RATE_PROVIDER: mock

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test conservative scope and required-gate rules
        run: python -m unittest django_project.tests.test_ci_scope
      - name: Classify the exact change and validate prose-only updates
        id: scope
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python -m django_project.ci_scope scope
          --base "$BASE_REVISION" --head "$HEAD_REVISION"
          --event "$EVENT_NAME" --output "$GITHUB_OUTPUT"

  checks:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Match the managed production database verified during release rehearsal.
        image: postgres:18.6
        env:
          POSTGRES_DB: jsk_ci
          POSTGRES_USER: jsk_ci
          POSTGRES_PASSWORD: jsk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jsk_ci -d jsk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run python manage.py migrate --noinput
      - name: Check migration drift
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run application checks
        run: uv run python manage.py check
      - name: Discover authoritative complete test inventory
        run: >-
          uv run python manage.py test
          --testrunner django_project.ci_runner.CiRunner
          --ci-plan-only --ci-shards 4 --ci-report-dir .ci-reports --noinput
      - name: Run production deployment checks
        run: uv run python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "False"
          ALLOWED_HOSTS: savings.example.invalid
          CSRF_TRUSTED_ORIGINS: https://savings.example.invalid
          APP_RELEASE: ci
          MEDIA_STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          R2_ACCESS_KEY_ID: ci-only-not-a-real-access-key
          R2_SECRET_ACCESS_KEY: ci-only-not-a-real-secret-key
          R2_BUCKET_NAME: ci-only-not-a-real-bucket
          R2_CUSTOM_DOMAIN: media.example.invalid
          DATABASE_URL: postgresql://jsk_ci:jsk_ci@127.0.0.1:5432/jsk_ci?sslmode=disable
          PAYMENT_GATEWAY: razorpay
          RAZORPAY_MODE: test
          RAZORPAY_KEY_ID: rzp_test_ci_only
          RAZORPAY_KEY_SECRET: ci-only-not-a-real-secret
          RAZORPAY_WEBHOOK_SECRET: ci-only-not-a-real-webhook-secret
          METAL_RATE_PROVIDER: goldapi
          GOLDAPI_API_KEY: ci-only-not-a-real-token
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.invalid
          DEFAULT_FROM_EMAIL: noreply@example.invalid
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
      - name: Collect production static files
        run: uv run python manage.py collectstatic --noinput
        env:
          DJANGO_DEBUG: "False"
      - name: Save authoritative inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: .ci-reports/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  tests:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' && github.event.pull_request.draft != true }}
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        # Match the managed production database verified during release rehearsal.
        image: postgres:18.6
        env:
          POSTGRES_DB: jsk_ci
          POSTGRES_USER: jsk_ci
          POSTGRES_PASSWORD: jsk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jsk_ci -d jsk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run python manage.py migrate --noinput
      - name: Run complete assigned classes serially and record timings
        run: >-
          uv run python manage.py test
          --testrunner django_project.ci_runner.CiRunner
          --ci-shard ${{ matrix.shard }} --ci-shards 4
          --ci-report-dir .ci-reports --parallel 1 --durations 30 --timing --noinput
      - name: Save test inventory and duration evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-shard-${{ matrix.shard }}
          path: .ci-reports/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Preserve the existing branch-protection check name. A skipped/failed shard,
  # stale report or incomplete inventory must never turn this gate green.
  django:
    if: ${{ always() }}
    needs: [scope, checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require complete tests or verified prose-only scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VALIDATION_MODE: ${{ needs.scope.outputs.mode }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: python -m django_project.ci_scope gate
      - name: Download inventory and execution reports
        if: ${{ needs.scope.outputs.mode == 'full' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*
          path: .ci-reports
          merge-multiple: true
      - name: Verify complete coverage and display slowest tests
        if: ${{ needs.scope.outputs.mode == 'full' }}
        run: python -m django_project.ci_inventory .ci-reports --revision "$GITHUB_SHA"

  container:
    needs: scope
    if: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && inputs.publish_image != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a validated scope; drafts cannot approve a runtime release
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VALIDATION_MODE: ${{ needs.scope.outputs.mode }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$VALIDATION_MODE" in
            docs) echo "Verified prose-only update: no image build or release claim." ;;
            full) test "$IS_DRAFT" != true ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.scope.outputs.mode == 'full' }}
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: ${{ needs.scope.outputs.mode == 'full' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build production image with reusable layers
        if: ${{ needs.scope.outputs.mode == 'full' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          tags: jsk-savings:${{ github.sha }}
          cache-from: type=gha,scope=jsk-linux-amd64,timeout=2m
          cache-to: type=gha,mode=max,scope=jsk-linux-amd64,ignore-error=true,timeout=2m
      - name: Scan production image for fixable critical vulnerabilities
        if: ${{ needs.scope.outputs.mode == 'full' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jsk-savings:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish-container:
    if: ${{ github.ref == 'refs/heads/main' && needs.scope.outputs.mode == 'full' && (github.event_name == 'push' || inputs.publish_image == true) }}
    needs: [scope, django]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/jsk-savings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the merged production image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=jsk-linux-amd64,timeout=2m
          cache-to: type=gha,mode=max,scope=jsk-linux-amd64,ignore-error=true,timeout=2m
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan the published digest for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Record immutable production image identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "Build did not return an immutable image digest" >&2; exit 1 ;;
          esac
          {
            echo "### Published production candidate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image tag: \`${IMAGE_REPOSITORY}:${GITHUB_SHA}\`"
            echo "- Deploy digest: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`"
            echo "- Critical vulnerability gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"
