name: jsk-savings

services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to the approved image tag or digest}
    restart: unless-stopped
    stop_grace_period: 40s
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - source: linode_db_ca
        target: linode_db_ca.pem
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.jsk.component: web
      com.jsk.release: ${APP_RELEASE:?Set APP_RELEASE to the approved commit}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/health/ready/',
          headers={'Host': 'jaishrikrishnajewellery.com',
          'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - edge

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notices}
      APP_RELEASE: ${APP_RELEASE:?Set APP_RELEASE to the approved commit}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    labels:
      com.jsk.component: edge
      com.jsk.release: ${APP_RELEASE:?Set APP_RELEASE to the approved commit}
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - edge

secrets:
  linode_db_ca:
    file: ${LINODE_DB_CA_FILE:?Set LINODE_DB_CA_FILE to the downloaded CA certificate}

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
