[project]
name = "jsk-savings-scheme"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django ~=6.0",
  "django-allauth[openid,socialaccount] ~=65.15",
  "django-debug-toolbar ~=6.3",
  "django-storages[s3] ~=1.14.6",
  "crispy-bootstrap5 ~=2026.3",
  "gunicorn ~=25.3",
  "psycopg[binary] ~=3.3",
  "whitenoise ~=6.12",
  "wagtail ~=8.0",
]

[tool.uv]
package = false
# Minimum patched releases for the critical advisories found by release CI.
constraint-dependencies = [
  "certifi>=2026.10.19",
  "pillow>=13.0.0",
  "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
  "typing_extensions ~=4.12",
]
