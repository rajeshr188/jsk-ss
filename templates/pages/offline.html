<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2d1811">
  <title>Connection required | Jai Sri Krishna Jewellery</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f8f5ef; color: #2d1811; }
    main { max-width: 36rem; margin: 15vh auto; padding: 2rem; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 4rem; height: 4rem;
      border-radius: 50%; background: #2d1811; color: #f5cc78; font-weight: 800; }
    h1 { font-size: clamp(1.6rem, 6vw, 2.25rem); }
    p { color: #5d463d; line-height: 1.6; }
    button { border: 0; border-radius: .5rem; padding: .75rem 1.25rem;
      background: #2d1811; color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">JSK</span>
    <h1>Connection required</h1>
    <p>Reconnect to view current scheme, payment, rate, eligibility, or account information. Nothing was submitted while you were offline.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
