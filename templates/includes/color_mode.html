<div class="dropdown color-mode-switcher {{ theme_position }}" data-color-mode hidden>
  <button class="btn color-mode-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Color mode: System" title="Color mode">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg>
  </button>
  <ul class="dropdown-menu dropdown-menu-end" aria-label="Color mode">
    <li><h2 class="dropdown-header fs-6">Appearance</h2></li>
    <li><button class="dropdown-item" type="button" data-theme-choice="light" aria-pressed="false">Light <span data-theme-check aria-hidden="true" hidden>✓</span></button></li>
    <li><button class="dropdown-item" type="button" data-theme-choice="dark" aria-pressed="false">Dark <span data-theme-check aria-hidden="true" hidden>✓</span></button></li>
    <li><button class="dropdown-item" type="button" data-theme-choice="system" aria-pressed="true">System <span data-theme-check aria-hidden="true">✓</span></button></li>
  </ul>
</div>
