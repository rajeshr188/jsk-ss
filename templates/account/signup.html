{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign up | Jai Sri Krishna Jewelley{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <p class="page-eyebrow">Customer registration</p>
    <h1>Create an account</h1>
    <p class="text-secondary mb-4">Use the details agreed with the showroom.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-jsk w-100" type="submit">Create account</button>
    </form>
  </div>
</div>
{% endblock content %}
