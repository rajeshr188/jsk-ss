{% if customer %}
<aside class="card mb-4 d-print-none owner-customer-context" aria-label="Customer context"><div class="card-body">
  <div class="d-flex flex-column flex-lg-row justify-content-between gap-3">
    <div><strong>{{ customer.full_name }}</strong><div class="small text-secondary">{{ customer.customer_number }} · {{ customer.mobile_number }}<br>{{ customer.email }}</div></div>
    <nav class="d-flex flex-wrap gap-2 align-items-start" aria-label="Customer records">
      <a class="btn btn-sm btn-outline-dark" href="{% url 'schemes:customer_detail' customer.pk %}">Customer record</a>
      <a class="btn btn-sm btn-outline-dark" href="{% url 'schemes:owner_applications' %}?customer={{ customer.pk }}&amp;focus=all">Applications</a>
      <a class="btn btn-sm btn-outline-dark" href="{% url 'schemes:contribution_list' %}?customer={{ customer.pk }}">Contributions</a>
      {% if scheme_account %}<a class="btn btn-sm btn-outline-dark" href="{% url 'schemes:scheme_statement' scheme_account.scheme_number %}">Statement · {{ scheme_account.scheme_number }}</a>{% endif %}
    </nav>
  </div>
</div></aside>
{% endif %}
