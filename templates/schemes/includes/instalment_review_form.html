<form method="post" novalidate>
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form.hidden_fields %}{{ field }}{{ field.errors }}{% endfor %}
  {% for field in form.visible_fields %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
      {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Record review</button>
</form>
